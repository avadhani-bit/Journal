<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
  <title>Journal</title>

  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="shortcut icon" href="assets/icon-192.png" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6366F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Journal" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <!-- ── Auth gate ── -->
  <div id="auth-gate">
    <div class="gate-card">
      <img src="assets/icon-192.png" width="56" height="56" class="gate-icon" alt="" />
      <h1 class="gate-title">Journal</h1>
      <p class="gate-sub">A quiet place to write. Your entries sync privately across your devices.</p>
      <button id="google-signin-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5.1l-6.2-5.2C29.4 35.5 26.8 36.5 24 36.5c-5.2 0-9.6-3.4-11.2-8.1l-6.5 5C9.7 39.8 16.4 44 24 44z"/><path fill="#1565C0" d="M43.6 20H24v8h11.3c-.8 2.4-2.4 4.4-4.5 5.8l6.2 5.2C40.8 35.5 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
        Continue with Google
      </button>
      <div id="signin-error" class="gate-error"></div>
    </div>
  </div>

  <!-- ── Boot splash ── -->
  <div id="boot"><div class="boot-spinner"></div></div>

  <!-- ── App ── -->
  <div id="app">

    <!-- Sidebar (desktop) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <img src="assets/icon-192.png" width="26" height="26" alt="" />
          <span>Journal</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Close menu">
          <svg viewBox="0 0 24 24" class="ic"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <button class="compose-btn" id="compose-btn">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
        New entry
      </button>

      <nav class="side-nav" id="side-nav">
        <button class="side-link active" data-view="timeline">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Timeline</span>
        </button>
        <button class="side-link" data-view="calendar">
          <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>Calendar</span>
        </button>
        <button class="side-link" data-view="insights">
          <svg viewBox="0 0 24 24" class="ic"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
          <span>Insights</span>
        </button>
        <button class="side-link" data-view="favorites">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 17.75l-6.17 3.24 1.18-6.87-5-4.86 6.9-1L12 2l3.09 6.26 6.9 1-5 4.86 1.18 6.87z"/></svg>
          <span>Favorites</span>
        </button>
      </nav>

      <div class="side-section">
        <div class="side-section-head">
          <span>Journals</span>
          <button class="icon-btn xs" id="add-journal-btn" aria-label="New journal">
            <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="journal-list"></div>
      </div>

      <div class="side-section" id="tag-cloud-section">
        <div class="side-section-head"><span>Tags</span></div>
        <div id="tag-cloud" class="tag-cloud"></div>
      </div>

      <div class="sidebar-foot">
        <button class="side-link" id="settings-link">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <!-- Main column -->
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div class="search-wrap">
          <svg viewBox="0 0 24 24" class="ic search-ic"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.1-4.1"/></svg>
          <input type="search" id="search-input" class="search-input" placeholder="Search entries…  /" autocomplete="off" />
          <button class="search-clear" id="search-clear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" class="ic"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="topbar-right">
          <div class="streak-chip" id="streak-chip" title="Current streak">
            <svg viewBox="0 0 24 24" class="ic flame"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.5.5-2.6 1-3.5C8.5 9 9 11 10.5 11 12 11 12 8 12 2z"/></svg>
            <span id="streak-count">0</span>
          </div>
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" class="ic" id="theme-icon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="avatar-btn" id="avatar-btn" aria-label="Account"><span id="avatar-inner">?</span></button>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="bn-item active" data-view="timeline">
        <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Timeline</span>
      </button>
      <button class="bn-item" data-view="calendar">
        <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Calendar</span>
      </button>
      <button class="bn-fab" id="fab-compose" aria-label="New entry">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="bn-item" data-view="insights">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span>Insights</span>
      </button>
      <button class="bn-item" data-view="favorites">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 17.75l-6.17 3.24 1.18-6.87-5-4.86 6.9-1L12 2l3.09 6.26 6.9 1-5 4.86 1.18 6.87z"/></svg><span>Starred</span>
      </button>
    </nav>
  </div>

  <!-- ── Editor sheet ── -->
  <div class="sheet-backdrop" id="editor-backdrop">
    <div class="sheet" id="editor-sheet" role="dialog" aria-label="Entry editor">
      <div class="sheet-head">
        <button class="icon-btn" id="editor-close" aria-label="Close">
          <svg viewBox="0 0 24 24" class="ic"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="sheet-head-mid">
          <button class="date-pill" id="editor-date-btn">
            <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span id="editor-date-label">Today</span>
          </button>
          <select class="journal-select" id="editor-journal"></select>
        </div>
        <div class="sheet-head-right">
          <span class="save-hint" id="save-hint"></span>
          <button class="icon-btn" id="editor-star" aria-label="Favorite">
            <svg viewBox="0 0 24 24" class="ic"><path d="M12 17.75l-6.17 3.24 1.18-6.87-5-4.86 6.9-1L12 2l3.09 6.26 6.9 1-5 4.86 1.18 6.87z"/></svg>
          </button>
          <button class="icon-btn danger" id="editor-delete" aria-label="Delete entry">
            <svg viewBox="0 0 24 24" class="ic"><path d="M3 6h18"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
          <button class="btn-primary" id="editor-save">Done</button>
        </div>
      </div>

      <div class="sheet-body">
        <div class="editor-inner">
          <div class="prompt-strip" id="prompt-strip">
            <svg viewBox="0 0 24 24" class="ic"><path d="M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.1V17h6v-1.4c0-.8.4-1.5 1-2.1A6 6 0 0 0 12 3z"/><path d="M10 21h4"/></svg>
            <span id="prompt-text"></span>
            <button class="icon-btn xs" id="prompt-shuffle" aria-label="Another prompt">
              <svg viewBox="0 0 24 24" class="ic"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
            </button>
            <button class="icon-btn xs" id="prompt-hide" aria-label="Hide prompt">
              <svg viewBox="0 0 24 24" class="ic"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <input type="text" id="editor-title" class="editor-title" placeholder="Title (optional)" />

          <div class="mood-strip" id="mood-strip"></div>

          <div class="format-bar" id="format-bar">
            <button data-cmd="bold" title="Bold"><b>B</b></button>
            <button data-cmd="italic" title="Italic"><i>I</i></button>
            <button data-cmd="underline" title="Underline"><u>U</u></button>
            <span class="fb-div"></span>
            <button data-block="h2" title="Heading">H</button>
            <button data-cmd="insertUnorderedList" title="Bullet list">
              <svg viewBox="0 0 24 24" class="ic"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
            </button>
            <button data-block="blockquote" title="Quote">
              <svg viewBox="0 0 24 24" class="ic"><path d="M6 17h3l2-4V7H5v6h3zM15 17h3l2-4V7h-6v6h3z"/></svg>
            </button>
            <span class="fb-div"></span>
            <button id="photo-btn" title="Add photos">
              <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <input type="file" id="photo-input" accept="image/*" multiple hidden />
            <span class="word-count" id="word-count">0 words</span>
          </div>

          <div id="editor-body" class="editor-body" contenteditable="true" data-placeholder="Start writing…"></div>

          <div class="photo-grid" id="photo-grid"></div>

          <div class="tag-editor">
            <div class="tag-list" id="editor-tags"></div>
            <input type="text" id="tag-input" class="tag-input" placeholder="Add tag…" list="tag-suggestions" />
            <datalist id="tag-suggestions"></datalist>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Entry viewer ── -->
  <div class="sheet-backdrop" id="viewer-backdrop">
    <div class="sheet viewer" id="viewer-sheet" role="dialog" aria-label="Entry">
      <div class="sheet-head">
        <button class="icon-btn" id="viewer-close" aria-label="Close">
          <svg viewBox="0 0 24 24" class="ic"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="sheet-head-mid"><span id="viewer-date" class="viewer-date"></span></div>
        <div class="sheet-head-right">
          <button class="icon-btn" id="viewer-star" aria-label="Favorite">
            <svg viewBox="0 0 24 24" class="ic"><path d="M12 17.75l-6.17 3.24 1.18-6.87-5-4.86 6.9-1L12 2l3.09 6.26 6.9 1-5 4.86 1.18 6.87z"/></svg>
          </button>
          <button class="btn-secondary" id="viewer-edit">Edit</button>
        </div>
      </div>
      <div class="sheet-body"><div class="viewer-inner" id="viewer-body"></div></div>
    </div>
  </div>

  <!-- ── Lightbox ── -->
  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt="" /></div>

  <!-- ── Generic modal ── -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal">
      <div class="modal-head">
        <h2 id="modal-title">Title</h2>
        <button class="icon-btn" id="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" class="ic"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          reg.update();
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch(function (e) { console.warn('SW reg failed:', e); });
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
